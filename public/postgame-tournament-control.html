<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Post Game Tournament Colors</title>
    <style>
      body {
        margin: 0;
        background: #0c1422;
        color: #edf1f6;
        font:
          16px Arial,
          sans-serif;
      }
      main {
        max-width: 1100px;
        margin: 35px auto;
        padding: 20px;
      }
      h1 {
        margin-bottom: 8px;
      }
      p {
        color: #a5b6cd;
      }
      #fields {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin: 25px 0;
      }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #18263b;
        padding: 15px;
      }
      input {
        width: 65px;
        height: 38px;
        border: 0;
        background: none;
      }
      button,
      a {
        padding: 12px 18px;
        margin-right: 8px;
        color: #fff;
        background: #224fc4;
        border: 0;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      iframe {
        width: 100%;
        aspect-ratio: 16/9;
        border: 1px solid #40516b;
        margin-top: 20px;
      }
      #status {
        min-height: 24px;
      }
      @media (max-width: 650px) {
        #fields {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body data-color-output="postgame">
    <main>
      <h1>Post Game Tournament Colors</h1>
      <p>
        1920 × 1080 frame with a transparent 1600 × 800 results window. Preview
        colors here, then save to update all OBS sources. Select BLUE WIN or RED
        WIN in the Control Panel to show a result.
      </p>
      <div id="fields"></div>
      <button id="save" disabled>Save colors</button
      ><button id="reset" disabled>Reset colors</button
      ><button id="reload">Reload saved colors</button
      ><a href="/control.html">Winner controls</a>
      <p id="status" role="status">Loading colors…</p>
      <iframe
        id="preview"
        src="/postgame-tournament.html"
        title="Post Game Tournament preview"
      ></iframe>
    </main>
    <script src="/script/broadcast-color-model.js"></script>
    <script src="/script/match-winner-control.js"></script>
  </body>
</html>
