    <script>
      function createDots(containerId, total) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = "";
        for (let i = 0; i < total; i++) {
          const dot = document.createElement("span");
          dot.classList.add("dot");
          container.appendChild(dot);
        }
      }

      function getWinsNeeded(format) {
        if (format === 1) return 1;
        if (format === 3) return 2;
        if (format === 5) return 3;
        if (format === 7) return 4;
        return 2;
      }

      async function updateScoreDots() {
        try {
          const response = await fetch("/api/matchdata");
          const data = await response.json();

          const blueScore = data.teamdata.blueteam.score || 0;
          const redScore = data.teamdata.redteam.score || 0;
          const format = data.matchFormat || 3;
          const winsNeeded = getWinsNeeded(format);

          createDots("blue-score-display", winsNeeded);
          createDots("red-score-display", winsNeeded);

          document
            .querySelectorAll("#blue-score-display .dot")
            .forEach((dot, i) => {
              dot.classList.toggle("active", i < blueScore);
            });
          document
            .querySelectorAll("#red-score-display .dot")
            .forEach((dot, i) => {
              dot.classList.toggle("active", i < redScore);
            });
        } catch (e) {
          console.error("Failed to update score dots:", e);
        }
      }

      // BAGONG FUNCTION PARA SA MATCH AT GAME TEXT
      async function updateMatchText() {
        try {
          const response = await fetch("/api/matchdata");
          const data = await response.json();

          const matchText = data.matchInfo?.match || "MATCH";
          const gameText = data.matchInfo?.game || "GAME";

          const matchEl = document.getElementById("display-match-text");
          const gameEl = document.getElementById("display-game-text");

          if (matchEl) matchEl.textContent = matchText;
          if (gameEl) gameEl.textContent = gameText;
        } catch (e) {
          console.error("Failed to update match text:", e);
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        updateScoreDots();
        updateMatchText(); // Tawagin pagka-load
        setInterval(updateScoreDots, 2000);
        setInterval(updateMatchText, 2000); // I-update every 2 seconds
      });
    </script>
