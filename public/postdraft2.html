<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post-draft output</title>
    <link rel="stylesheet" href="/themes/postdraft-base.css" />
  </head>
  <body>
    <main id="postdraft-stage">
      <header class="pd-header">
        <div class="pd-team pd-blue">
          <img id="displayImage1" alt="" />
          <div>
            <div id="name-box-1" class="pd-team-name"></div>
            <div id="blue-score-display" class="pd-wins"></div>
          </div>
        </div>
        <div class="pd-match">
          <div id="display-match-text"></div>
          <div id="display-game-text"></div>
        </div>
        <div class="pd-team pd-red">
          <img id="displayImage2" alt="" />
          <div>
            <div id="name-box-8" class="pd-team-name"></div>
            <div id="red-score-display" class="pd-wins"></div>
          </div>
        </div>
      </header>
      <div class="pd-main">
        <section
          id="pd-blue-bank"
          class="pd-bank pd-blue"
          aria-label="Left team picks"
        ></section>
        <div class="pd-gap" aria-hidden="true"></div>
        <section
          id="pd-red-bank"
          class="pd-bank pd-red"
          aria-label="Right team picks"
        ></section>
      </div>
    </main>
    <script src="/script/match-state.js"></script>
    <script src="/script/match-client.js"></script>
    <script src="/script/roster-model.js"></script>
    <script src="/script/draft-model.js"></script>
    <script src="/script/roster-themes.js"></script>
    <script src="/script/broadcast-color-model.js"></script>
    <script src="/script/broadcast-color-client.js"></script>
    <script src="/script/roster-theme-client.js"></script>
    <script src="/script/postdraft-renderer.js"></script>
  </body>
</html>
