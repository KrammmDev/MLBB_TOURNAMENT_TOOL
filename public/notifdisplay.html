<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Notification Overlay</title>
    <link
      rel="preload"
      as="font"
      type="font/otf"
      href="/Assets/Font/Renegade%20Pursuit.otf"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/ttf"
      href="/Assets/Font/big_noodle_titling.ttf"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="/themes/notification-overlay.css?v=role-row-1"
    />
  </head>
  <body>
    <main id="notification-stage">
      <video id="videoPlayer" playsinline>
        <source id="videoSource" src="" type="video/webm" />
      </video>
      <section id="player-notification" hidden aria-live="polite">
        <div class="notification-panel" aria-hidden="true"></div>
        <div
          id="notification-art"
          class="notification-art"
          aria-hidden="true"
        ></div>
        <div class="notification-copy">
          <div class="notification-event" id="notification-event"></div>
          <div class="notification-identity">
            <span
              id="notification-role"
              class="notification-role"
              hidden
            ></span>
            <div class="notification-player" id="notification-player"></div>
          </div>
        </div>
      </section>
    </main>
    <script src="/script/match-state.js"></script>
    <script src="/script/match-client.js"></script>
    <script src="/script/notification-model.js"></script>
    <script src="/script/roster-model.js"></script>
    <script src="/script/notification-overlay.js?v=role-row-1"></script>
  </body>
</html>
