<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Notification Overlay</title>
    <link rel="stylesheet" href="/themes/notification-overlay.css" />
  </head>
  <body>
    <main id="notification-stage">
      <video id="videoPlayer" playsinline>
        <source id="videoSource" src="" type="video/webm" />
      </video>
      <section id="player-notification" hidden aria-live="polite">
        <div class="notification-event" id="notification-event"></div>
        <div class="notification-player" id="notification-player"></div>
        <div class="notification-team" id="notification-team"></div>
      </section>
    </main>
    <script src="/script/match-state.js"></script>
    <script src="/script/match-client.js"></script>
    <script src="/script/notification-model.js"></script>
    <script src="/script/notification-overlay.js"></script>
  </body>
</html>
