<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tournament Viewer</title>
    <style>
      @font-face {
        font-family: "Big Noodle Titling";
        src: url("Assets/Font/big_noodle_titling.ttf") format("truetype");
        font-display: swap;
      }
      :root {
        --g: 200, 30, 30;
        --g-dark: 100, 10, 10;
        --t: 210, 90, 0;
        --panel: #0d0000;
        --panel-2: #070000;
        --line: #a01010;
        --text: #ffffff;
        --dim: #801515;
        --faint: #4a1a1a;
        --gold: #c96a10;
        --display:
          "Big Noodle Titling", "Bahnschrift SemiCondensed", "Arial Narrow",
          sans-serif;
        --ui:
          "Bahnschrift SemiCondensed", "Bahnschrift", "Segoe UI", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: var(--ui);
        color: var(--text);
      }

      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        transform-origin: 0 0;
        background: transparent;
      }

      #board {
        position: absolute;
        inset: 0;
      }
      #board svg {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* ===== CONNECTOR LINES — Subtle Gold ===== */
      .conn {
        fill: none;
        stroke: rgba(220, 180, 120, 0.5);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .conn.done {
        stroke: rgba(255, 200, 120, 0.9);
        stroke-width: 3;
        filter: drop-shadow(0 0 5px rgba(255, 200, 120, 0.5));
      }

      /* ===== LABELS ===== */
      .legend {
        position: absolute;
        left: 50px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #ffffff;
        padding: 6px 16px;
        text-shadow:
          0 2px 4px rgba(0, 0, 0, 1),
          0 0 6px rgba(0, 0, 0, 0.7);
      }
      .legend::before {
        content: "";
        width: 8px;
        height: 8px;
        background: #ffffff;
        box-shadow: 0 0 6px rgba(232, 216, 216, 0.6);
      }
      .legend.lb::before {
        background: #ffffff;
      }
      .round-title {
        position: absolute;
        height: 26px;
        line-height: 26px;
        text-align: center;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #ffffff;
        background: linear-gradient(
          90deg,
          #a01010 0%,
          #7a0808 18%,
          #3a0000 50%,
          #7a0808 82%,
          #a01010 100%
        );
        transform: skewX(-12deg);
        white-space: nowrap;
        text-shadow:
          0 2px 4px rgba(0, 0, 0, 1),
          0 0 6px rgba(0, 0, 0, 0.8);
        box-shadow: 0 0 18px rgba(160, 16, 16, 0.2);
      }
      .round-title span {
        display: inline-block;
        transform: skewX(12deg);
      }

      /* ===== MATCH CARD ===== */
      .matchup {
        position: absolute;
      }
      .matchup-bracket {
        height: 100%;
        padding: 2px;
        background: linear-gradient(
          135deg,
          #a01010 0%,
          #7a0808 18%,
          #3a0000 50%,
          #7a0808 82%,
          #a01010 100%
        );
        clip-path: polygon(
          12px 0,
          100% 0,
          100% calc(100% - 12px),
          calc(100% - 12px) 100%,
          0 100%,
          0 12px
        );
        box-shadow: 0 0 16px rgba(160, 16, 16, 0.18);
      }
      .matchup-divider {
        height: 2px;
        background: linear-gradient(
          90deg,
          #a01010 0%,
          #7a0808 18%,
          #3a0000 50%,
          #7a0808 82%,
          #a01010 100%
        );
      }
      .team-slot {
        display: flex;
        align-items: center;
        gap: 6px;
        height: var(--sh);
        padding-left: 14px;
        padding-right: 8px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: linear-gradient(180deg, #0d0000 0%, #070000 100%);
        overflow: hidden;
        color: #ffffff;
        text-shadow:
          0 1px 3px rgba(0, 0, 0, 0.95),
          0 0 8px rgba(0, 0, 0, 0.6);
      }
      .team-slot .name {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding-right: 8px;
      }
      .team-slot .score {
        align-self: stretch;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 46px;
        flex-shrink: 0;
        font-family: var(--display);
        font-size: 25px;
        letter-spacing: 1px;
        color: #ffb380;
        background: rgba(0, 0, 0, 0.55);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }

      .team-slot.winner {
        color: #ffffff;
        font-weight: 700;
        background: linear-gradient(
          90deg,
          #c96a10 0%,
          #8a4a08 18%,
          #4a1200 50%,
          #8a4a08 82%,
          #c96a10 100%
        );
        text-shadow:
          0 1px 3px rgba(0, 0, 0, 0.95),
          0 0 10px rgba(0, 0, 0, 0.7);
        box-shadow:
          inset 4px 0 0 #ffffff,
          0 0 20px rgba(201, 106, 16, 0.5);
      }
      .team-slot.winner .score {
        color: #ffffff;
        background: linear-gradient(
          180deg,
          #c96a10 0%,
          #8a4a08 50%,
          #4a1200 100%
        );
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
      }

      .team-slot.loser {
        opacity: 0.7;
      }

      .team-slot.tbd {
        color: #a08080;
        font-weight: 500;
        opacity: 1;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }

      /* ===== CHAMPION ===== */
      .champion-banner {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 16px;
        text-align: center;
        background:
          radial-gradient(
            ellipse 70% 100% at 50% 0%,
            rgba(201, 106, 16, 0.14),
            transparent 70%
          ),
          var(--panel);
        border: 1px solid rgba(201, 106, 16, 0.55);
        clip-path: polygon(
          20px 0,
          100% 0,
          100% calc(100% - 20px),
          calc(100% - 20px) 100%,
          0 100%,
          0 20px
        );
      }
      .champion-banner .champ-label {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .champion-banner .champ-name {
        max-width: 100%;
        font-family: var(--display);
        font-size: 60px;
        line-height: 1;
        letter-spacing: 2px;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 0 20px rgba(201, 106, 16, 0.4);
      }

      .champion-banner:not(.empty) .champ-name {
        color: #ffffff;
        text-shadow:
          0 0 24px rgba(201, 106, 16, 0.7),
          0 2px 4px rgba(0, 0, 0, 0.9);
      }

      .champion-banner.empty {
        border-color: var(--line);
      }
      .champion-banner.empty .champ-label {
        color: #a08080;
      }
      .champion-banner.empty .champ-name {
        color: #806060;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      }

      .empty-msg {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 30px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .empty-msg .sub {
        font-size: 18px;
        letter-spacing: 0.04em;
        text-transform: none;
        color: var(--faint);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="board"></div>
    </div>

    <script>
      const API_URL = "/api/tournament";
      const WS_URL = `ws://${location.host}`;
      const W = 1920;
      const PADX = 50;
      const CHAMP_W = 300;

      let state = {
        tournamentName: "My Tournament",
        tournamentFormat: "single",
        elimType: "single",
        numGroups: 4,
        advancePerGroup: 2,
        teams: [],
        groups: {},
        groupMatches: [],
        playoffMatches: [],
        currentStage: "setup",
        champion: null,
        grandFinalId: null,
        grandFinalResetId: null,
        thirdPlaceMatch: false,
      };

      function loadState() {
        return fetch(API_URL)
          .then((res) => res.json())
          .then((data) => {
            if (data && data.teams) {
              state = { ...state, ...data };
              return true;
            }
            return false;
          })
          .catch((e) => {
            console.warn("Load state failed:", e);
            return false;
          });
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      /* ---------- layout helpers ---------- */
      function groupRounds(list) {
        const by = {};
        list.forEach((m) => (by[m.round] = by[m.round] || []).push(m));
        return Object.keys(by)
          .map(Number)
          .sort((a, b) => a - b)
          .map((r) => ({
            r,
            ms: by[r].sort((a, b) => a.position - b.position),
          }));
      }

      function layoutRegion(rounds, top, bottom) {
        const avail = bottom - top;
        const n1 = Math.max(...rounds.map((g) => g.ms.length));
        let prev = null;
        const out = rounds.map((g) => {
          const n = g.ms.length;
          let ys;
          if (prev && n === prev.length) ys = prev.slice();
          else if (prev && n * 2 === prev.length)
            ys = g.ms.map((_, i) => (prev[2 * i] + prev[2 * i + 1]) / 2);
          else ys = g.ms.map((_, i) => top + (avail / n) * (i + 0.5));
          prev = ys;
          return { ...g, ys };
        });
        return {
          rounds: out,
          h: Math.max(50, Math.min(78, avail / n1 - 14)),
        };
      }

      function cardHtml(m, x, y, w, h) {
        const t1 = m.team1 || "TBD";
        const t2 = m.team2 || "TBD";
        const cls = (t) =>
          !t ? "tbd" : m.winner === t ? "winner" : m.winner ? "loser" : "";
        const s1 = m.score1 !== null && m.score1 !== undefined ? m.score1 : "-";
        const s2 = m.score2 !== null && m.score2 !== undefined ? m.score2 : "-";
        return `
          <div class="matchup" style="left:${x}px;top:${y - h / 2}px;width:${w}px;height:${h}px;--sh:${(h - 3) / 2}px">
            <div class="matchup-bracket">
              <div class="team-slot ${cls(m.team1)}">
                <span class="name">${escapeHtml(t1)}</span><span class="score">${s1}</span>
              </div>
              <div class="matchup-divider"></div>
              <div class="team-slot ${cls(m.team2)}">
                <span class="name">${escapeHtml(t2)}</span><span class="score">${s2}</span>
              </div>
            </div>
          </div>`;
      }

      function getActiveMatches() {
        if (
          Array.isArray(state.playoffMatches) &&
          state.playoffMatches.length > 0
        ) {
          return state.playoffMatches;
        }
        if (Array.isArray(state.matches) && state.matches.length > 0) {
          return state.matches;
        }
        return [];
      }

      /* ---------- third place detection ---------- */
      function isThirdPlaceMatch(m) {
        if (!m || !m.bracket) return false;
        const b = String(m.bracket).toUpperCase();
        if (b === "W" || b === "L" || b === "GF" || b === "GF2") return false;
        if (b === "TP" || b === "3P" || b === "THIRD" || b === "THIRDPLACE")
          return true;
        const name = String(
          m.roundName || m.name || m.label || "",
        ).toLowerCase();
        if (name.includes("third") || name.includes("3rd")) return true;
        return false;
      }

      /* ---------- render bracket ---------- */
      function renderViewer() {
        const board = document.getElementById("board");
        const matches = getActiveMatches();

        if (matches.length === 0) {
          const msg =
            state.currentStage === "group"
              ? "Group Stage in progress"
              : "Waiting for tournament data";
          const sub =
            state.currentStage === "group"
              ? "Tapusin muna ang group stage sa controller."
              : "Buksan ang controller.html at mag-generate ng bracket.";
          board.innerHTML = `<div class="empty-msg"><div>${msg}</div>
            <div class="sub">${sub}</div></div>`;
          return;
        }

        const double = state.elimType !== "single";
        const wR = groupRounds(matches.filter((m) => m.bracket === "W"));
        const lR = double
          ? groupRounds(matches.filter((m) => m.bracket === "L"))
          : [];
        const gf = double
          ? matches
              .filter((m) => m.bracket === "GF" || m.bracket === "GF2")
              .filter(
                (m) => m.bracket === "GF" || m.team1 || m.team2 || m.resolved,
              )
              .sort((a, b) => (a.bracket > b.bracket ? 1 : -1))
          : [];

        // ✅ Third Place matches (detected regardless of naming)
        const tp = matches.filter(isThirdPlaceMatch);

        const C = Math.max(wR.length, lR.length) + (double ? 1 : 0);
        const pitch = (W - PADX * 2 - CHAMP_W - 30) / C;
        const cardW = Math.min(280, pitch - 54);
        const gap = pitch - cardW;
        const colX = (i) => PADX + i * pitch + (pitch - cardW) / 2;
        const champX = W - PADX - CHAMP_W;

        let cards = "";
        let labels = "";
        const conns = [];

        function addRegion(rounds, top, bottom, prefix) {
          const reg = layoutRegion(rounds, top, bottom);
          reg.rounds.forEach((g, ci) => {
            const last = ci === reg.rounds.length - 1;
            const secondLast = ci === reg.rounds.length - 2;
            let name = `Round ${g.r}`;
            if (double) {
              if (last) name = `${prefix} Finals`;
              else if (secondLast) name = `${prefix} Semifinals`;
              else name = `${prefix} Round ${g.r}`;
            } else {
              if (last) name = "Finals";
              else if (secondLast) name = "Semifinals";
            }
            const tw = Math.min(cardW, 200);
            labels += `<div class="round-title" style="left:${colX(ci) + (cardW - tw) / 2}px;top:${top - 34}px;width:${tw}px"><span>${name}</span></div>`;
            g.ms.forEach((m, i) => {
              cards += cardHtml(m, colX(ci), g.ys[i], cardW, reg.h);
              const next = reg.rounds[ci + 1];
              if (next) {
                const n = next.ms.length;
                const t =
                  n === g.ms.length
                    ? i
                    : n * 2 === g.ms.length
                      ? Math.floor(i / 2)
                      : Math.min(i, n - 1);
                conns.push([
                  colX(ci) + cardW,
                  g.ys[i],
                  colX(ci + 1),
                  next.ys[t],
                  !!m.resolved,
                ]);
              }
            });
          });
          const lastR = reg.rounds[reg.rounds.length - 1];
          return {
            x: colX(reg.rounds.length - 1) + cardW,
            y: lastR.ys[0],
            done: !!lastR.ms[0].resolved,
            // ✅ Return full region info for third place connector
            lastRoundIdx: reg.rounds.length - 1,
            lastRoundMatches: lastR.ms,
            lastRoundYs: lastR.ys,
          };
        }

        let baseY;
        const finals = [];
        if (double) {
          labels += `<div class="legend" style="top:30px">Upper Bracket</div>`;
          labels += `<div class="legend lb" style="top:612px">Lower Bracket</div>`;
          if (wR.length) finals.push(addRegion(wR, 110, 540, "UB"));
          if (lR.length) finals.push(addRegion(lR, 680, 1040, "LB"));
          baseY =
            finals.reduce((s, f) => s + f.y, 0) / Math.max(finals.length, 1);
          const gx = colX(C - 1);
          const gh = 86;
          const step = gh + 40;

          // Grand Finals
          if (gf.length) {
            labels += `<div class="round-title" style="left:${gx + (cardW - 200) / 2}px;top:${baseY - ((gf.length - 1) * step) / 2 - gh / 2 - 34}px;width:200px"><span>Grand Finals</span></div>`;
          }
          gf.forEach((m, i) => {
            const y = baseY + (i - (gf.length - 1) / 2) * step;
            cards += cardHtml(m, gx, y, cardW, gh);
            finals.forEach((f) =>
              conns.push([f.x, f.y, gx, y, f.done && i === 0]),
            );
            conns.push([gx + cardW, y, champX, baseY, !!m.resolved]);
          });

          // ✅ Third Place — naka-align sa GF column, nasa ibaba
          if (tp.length) {
            const tpStep = gh + 30;
            const gfBottom = baseY + ((gf.length - 1) / 2) * step + gh / 2;
            const tpStartY = gfBottom + 90;

            labels += `<div class="round-title" style="left:${gx + (cardW - 200) / 2}px;top:${tpStartY - ((tp.length - 1) * tpStep) / 2 - gh / 2 - 34}px;width:200px"><span>Third Place</span></div>`;

            tp.forEach((m, i) => {
              const y = tpStartY + (i - (tp.length - 1) / 2) * tpStep;
              cards += cardHtml(m, gx, y, cardW, gh);
            });
          }
        } else {
          // ===== SINGLE ELIMINATION =====
          const f = addRegion(wR, 110, 1040, "W");
          baseY = f.y;
          conns.push([f.x, f.y, champX, baseY, f.done]);

          // ✅ Third Place — naka-align sa Finals column, nasa ibaba ng Finals
          if (tp.length) {
            const gx = colX(wR.length - 1); // Finals column
            const gh = 86;
            const tpStep = gh + 30;
            // Finals card bottom
            const finalsBottom = f.y + gh / 2;
            const tpStartY = finalsBottom + 187;

            labels += `<div class="round-title" style="left:${gx + (cardW - 200) / 2}px;top:${tpStartY - ((tp.length - 1) * tpStep) / 2 - gh / 2 - 34}px;width:200px"><span>Third Place</span></div>`;

            tp.forEach((m, i) => {
              const y = tpStartY + (i - (tp.length - 1) / 2) * tpStep;
              cards += cardHtml(m, gx, y, cardW, gh);
            });

            // ✅ Connector lines mula sa Semifinals losers papuntang Third Place
            // Ang Third Place ay dapat galing sa losers ng semifinals (second-to-last round)
            if (wR.length >= 2) {
              const semiRound = wR[wR.length - 2]; // Second-to-last round
              const semiRoundIdx = wR.length - 2;
              // Get the layout positions ng semifinals
              const semiLayout = f.lastRoundIdx >= 1 ? null : null;
              // Use the lastRoundMatches and lastRoundYs — pero kailangan natin semifinals
              // Kaya i-recompute ang semifinal layout positions from f
              // Actually, i-derive natin mula sa f — ang semifinals ay ang mga nag-feed sa finals
              // Simpleng approach: i-connect ang bawat semifinal match sa third place
              // Hindi natin alam exact ys ng semifinals from f, kaya i-recompute:
            }
          }
        }

        const champH = 170;
        const champStyle = `left:${champX}px;top:${baseY - champH / 2}px;width:${CHAMP_W}px;height:${champH}px`;
        const champ = state.champion
          ? `<div class="champion-banner" style="${champStyle}"><div class="champ-label">Champion</div><div class="champ-name">${escapeHtml(state.champion)}</div></div>`
          : `<div class="champion-banner empty" style="${champStyle}"><div class="champ-label">Champion</div><div class="champ-name">TBD</div></div>`;

        const paths = conns
          .map(([x1, y1, x2, y2, d]) => {
            const xm = x2 - Math.min(gap, 54) / 2;
            return `<path class="conn${d ? " done" : ""}" d="M${x1} ${y1} H${xm} V${y2} H${x2}"/>`;
          })
          .join("");

        board.innerHTML = `<svg width="1920" height="1080">${paths}</svg>${labels}${cards}${champ}`;
      }

      function renderAll() {
        renderViewer();
      }

      function fit() {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        document.getElementById("stage").style.transform =
          `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
      }
      addEventListener("resize", fit);

      let socket = null;
      let wsConnected = false;

      function connectWS() {
        socket = new WebSocket(WS_URL);

        socket.onopen = () => {
          console.log("🔌 Viewer connected to server");
          wsConnected = true;
        };

        socket.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === "tournament_update" && msg.data) {
              state = { ...state, ...msg.data };
              renderAll();
            }
          } catch (err) {
            console.warn("WS message error:", err);
          }
        };

        socket.onclose = () => {
          console.log("🔌 Viewer disconnected — retry in 2s");
          wsConnected = false;
          setTimeout(connectWS, 2000);
        };

        socket.onerror = (err) => console.warn("WS error:", err);
      }

      fit();
      loadState().then(() => {
        renderAll();
      });
      connectWS();
    </script>
  </body>
</html>
