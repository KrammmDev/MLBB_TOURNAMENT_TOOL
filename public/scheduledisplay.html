<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Schedule Broadcast</title>
    <link rel="stylesheet" href="/themes/schedule-base.css" />
    <link rel="stylesheet" href="/themes/sponsor-slideshow.css" />
  </head>
  <body>
    <main id="schedule-stage" hidden>
      <header class="schedule-header">
        <img id="schedule-brand" alt="Tournament logo" hidden />
        <div>
          <span id="schedule-event">TODAY'S SCHEDULE</span>
          <p id="schedule-context"></p>
        </div>
      </header>
      <section class="schedule-sidebar">
        <h1 id="schedule-heading">TODAY'S SCHEDULE</h1>
        <div id="schedule-cards"></div>
        <div id="schedule-empty" hidden>No matches selected</div>
        <div id="schedule-partners" hidden></div>
      </section>
      <aside id="schedule-talents" hidden>
        <h2>TALENTS</h2>
        <img id="schedule-casters" alt="Configured caster panel" hidden />
      </aside>
      <div
        id="schedule-video-window"
        aria-label="Transparent opening for your OBS video source"
      ></div>
      <section class="schedule-countdown">
        <span id="schedule-timer-label">SHOW STARTS IN</span
        ><strong id="schedule-timer">00:00</strong>
      </section>
      <footer>
        <span id="schedule-footer"></span>
      </footer>
    </main>
    <script src="/script/match-state.js"></script>
    <script src="/script/match-client.js"></script>
    <script src="/script/roster-model.js"></script>
    <script src="/script/roster-themes.js"></script>
    <script src="/script/broadcast-color-model.js"></script>
    <script src="/script/broadcast-color-client.js"></script>
    <script src="/script/roster-theme-client.js"></script>
    <script src="/script/production-timer-model.js"></script>
    <script src="/script/schedule-renderer.js"></script>
  </body>
</html>
