<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard</title>
    <link rel="stylesheet" href="/themes/scoreboard-base.css" />
  </head>
  <body>
    <main id="scoreboard-stage">
      <div class="scoreboard" aria-label="Gameplay scoreboard overlay">
        <div class="sb-frame" aria-hidden="true"></div>
        <div class="sb-banner sb-banner-left" aria-hidden="true"></div>
        <div class="sb-banner sb-banner-right" aria-hidden="true"></div>
        <div class="upper">
          <div class="mapbox" aria-hidden="true"></div>
          <div class="gb1" aria-hidden="true"></div>
          <div class="logo sb-team-logo"><img id="displayImage1" alt="" /></div>
          <div class="uppermid" aria-hidden="true"></div>
          <div class="logo sb-team-logo"><img id="displayImage2" alt="" /></div>
          <div class="logo match-info">
            <div id="match-display"></div>
            <div id="sb-game"></div>
          </div>
        </div>
        <div class="lower">
          <div class="mapbox" aria-hidden="true"></div>
          <div class="gb1" aria-hidden="true"></div>
          <div class="logo" aria-hidden="true"></div>
          <div class="uppermid">
            <div class="midscorename">
              <div class="teamnamesc sb-left">
                <div class="tn">
                  <div id="name-box-1" class="name-box"></div>
                </div>
                <div class="score-dots" id="blue-score-display"></div>
                <div
                  id="blue-turtle-container"
                  class="turtle-container blue-turtle"
                ></div>
              </div>
              <div class="gb2" aria-hidden="true"></div>
              <div class="teamnamesc sb-right">
                <div
                  class="turtle-container red-turtle"
                  id="red-turtle-container"
                ></div>
                <div class="score-dots" id="red-score-display"></div>
                <div class="tn">
                  <div id="name-box-8" class="name-box"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="sb-sponsors" aria-label="Sponsor slideshow"></div>
      </div>
    </main>
    <script src="/script/match-state.js"></script>
    <script src="/script/match-client.js"></script>
    <script src="/script/roster-model.js"></script>
    <script src="/script/roster-themes.js"></script>
    <script src="/script/broadcast-color-model.js"></script>
    <script src="/script/broadcast-color-client.js"></script>
    <script src="/script/roster-theme-client.js"></script>
    <script src="/script/sponsor-slideshow.js"></script>
    <script src="/script/scoreboard-renderer.js"></script>
  </body>
</html>
