<script>
  function createDots(containerId, total) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = "";
    for (let i = 0; i < total; i++) {
      const dot = document.createElement("span");
      dot.classList.add("dot");
      container.appendChild(dot);
    }
  }

  // FIXED: Added BO1 support (format = 1 needs 1 win)
  function getWinsNeeded(format) {
    if (format === 1) return 1;      // BO1 - isang panalo lang
    if (format === 3) return 2;      // BO3 - kailangan 2 panalo
    if (format === 5) return 3;      // BO5 - kailangan 3 panalo
    if (format === 7) return 4;      // BO7 - kailangan 4 na panalo
    return 2;                         // default BO3
  }

  async function updateScoreDots() {
    try {
      const response = await fetch("/api/matchdata");
      const data = await response.json();

      const blueScore = data.teamdata.blueteam.score || 0;
      const redScore = data.teamdata.redteam.score || 0;
      const format = data.matchFormat || 3;
      const winsNeeded = getWinsNeeded(format);

      createDots("blue-score-display", winsNeeded);
      createDots("red-score-display", winsNeeded);

      document.querySelectorAll("#blue-score-display .dot").forEach((dot, i) => {
        dot.classList.toggle("active", i < blueScore);
      });
      document.querySelectorAll("#red-score-display .dot").forEach((dot, i) => {
        dot.classList.toggle("active", i < redScore);
      });

      // Update match display from API if available
      if (data.matchInfo) {
        const matchEl = document.getElementById("match-display");
        if (matchEl && data.matchInfo.text) {
          matchEl.textContent = data.matchInfo.text.toUpperCase();
        }
      }
    } catch (e) {
      console.error("Failed to update score dots:", e);
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    updateScoreDots();
    // Poll every 2 seconds to stay in sync with control panel
    setInterval(updateScoreDots, 2000);
  });
</script>
