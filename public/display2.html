<script>
  // --- SCORE DOTS & MATCH INFO ---
  function createDots(containerId, total) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = "";
    for (let i = 0; i < total; i++) {
      const dot = document.createElement("span");
      dot.classList.add("dot");
      container.appendChild(dot);
    }
  }

  function getWinsNeeded(format) {
    if (format === 1) return 1;
    if (format === 3) return 2;
    if (format === 5) return 3;
    if (format === 7) return 4;
    return 2;
  }

  async function updateScoreDots() {
    try {
      const response = await fetch("/api/matchdata");
      const data = await response.json();

      const blueScore = data.teamdata.blueteam.score || 0;
      const redScore = data.teamdata.redteam.score || 0;
      const format = data.matchFormat || 3;
      const winsNeeded = getWinsNeeded(format);

      createDots("blue-score-display", winsNeeded);
      createDots("red-score-display", winsNeeded);

      document.querySelectorAll("#blue-score-display .dot").forEach((dot, i) => {
        dot.classList.toggle("active", i < blueScore);
      });
      document.querySelectorAll("#red-score-display .dot").forEach((dot, i) => {
        dot.classList.toggle("active", i < redScore);
      });

      function fitCoachName(el) {
        if (!el) return;
        const maxWidth = 140;
        let fontSize = 28;
        el.style.fontSize = fontSize + "px";
        while (el.scrollWidth > maxWidth && fontSize > 10) {
          fontSize -= 1;
          el.style.fontSize = fontSize + "px";
        }
      }

      if (data.teamdata) {
        const coachLeftEl = document.getElementById("coach-name-left");
        const coachRightEl = document.getElementById("coach-name-right");
        if (coachLeftEl) {
          coachLeftEl.textContent = data.teamdata.blueteam?.coach || "-";
          fitCoachName(coachLeftEl);
        }
        if (coachRightEl) {
          coachRightEl.textContent = data.teamdata.redteam?.coach || "-";
          fitCoachName(coachRightEl);
        }
      }

      if (data.matchInfo) {
        const matchEl = document.getElementById("match-display");
        if (matchEl) {
          const matchText = data.matchInfo.match || "MATCH 1";
          const gameText = data.matchInfo.game || "GAME 1";
          matchEl.innerHTML = `
            <span class="match-title">${matchText.toUpperCase()} | </span>
            <br>
            <span class="game-title">${gameText.toUpperCase()}</span>
          `;
        }
      }

      if (data.timer !== undefined) {
        const timerEl = document.getElementById("timer");
        if (timerEl) {
          timerEl.textContent = data.timer;
          const countdownEl = timerEl.closest('.countdown');
          if (countdownEl) {
            if (data.timer <= 5) {
              countdownEl.classList.add('warning');
            } else {
              countdownEl.classList.remove('warning');
            }
          }
        }
      }
    } catch (e) {
      console.error("Failed to update score dots:", e);
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    updateScoreDots();
    setInterval(updateScoreDots, 2000);
  });

  // --- SYNC PICKING LABELS NA MAY ARROW ---
  function syncPickingLabels() {
    document.querySelectorAll(".active-pick, .active-ban").forEach((el) => {
      const host = el.closest(".heropick, .banhero");
      if (!host || host.querySelector(":scope > .picking-label")) return;

      const label = document.createElement("div");
      label.className = "picking-label";
      label.setAttribute("aria-hidden", "true");

      // Arrow Kaliwa
      const arrowLeft = document.createElement("div");
      arrowLeft.className = "picker-arrow left";
      label.appendChild(arrowLeft);

      const textStr = el.classList.contains("active-ban") ? "BANNING" : "PICKING";
      
      textStr.split("").forEach((ch, i) => {
        const col = document.createElement("span");
        col.className = "pl";
        col.style.setProperty("--i", i);
        col.innerHTML = `
          <span class="pl-track" style="--i:${i}">
            <span class="solid">${ch}</span>
            <span class="outline">${ch}</span>
            <span class="solid">${ch}</span>
            <span class="outline">${ch}</span>
          </span>`;
        label.appendChild(col);
      });

      // Arrow Kanan
      const arrowRight = document.createElement("div");
      arrowRight.className = "picker-arrow right";
      label.appendChild(arrowRight);

      host.appendChild(label);
    });

    document.querySelectorAll(".picking-label").forEach((label) => {
      if (!label.parentElement.querySelector(".active-pick, .active-ban")) label.remove();
    });
  }

  new MutationObserver(syncPickingLabels).observe(document.body, {
    subtree: true,
    childList: true,
    attributes: true,
    attributeFilter: ["class"],
  });

  function syncGrowingSlots() {
    document.querySelectorAll(".pickholder").forEach((holder) => {
      const nickholder = holder.parentElement.querySelector(".nickholder");
      if (!nickholder) return;

      Array.from(holder.children).forEach((slot, i) => {
        const isActive =
          slot.querySelector(".active-pick") &&
          !slot.querySelector(".hero-name.show");

        slot.classList.toggle("is-growing", !!isActive);

        const nameBox = nickholder.children[i];
        if (nameBox) nameBox.classList.toggle("is-growing", !!isActive);
      });
    });
  }

  new MutationObserver(syncGrowingSlots).observe(document.body, {
    subtree: true,
    childList: true,
    attributes: true,
    attributeFilter: ["class"],
  });

  // Tingnan ang lahat ng pwedeng pagkunan ng "ADJUSTMENT" / "LAST CHANCE"
  function isBothTurn() {
    const re = /adjust|last[\s_-]*chance/i;

    // 1) #phase (nakatago, kaya textContent ang gamit, hindi innerText)
    const phase = document.getElementById("phase");
    if (phase && re.test(phase.textContent || "")) return true;

    // 2) yung arrow image sa baba ng middle panel (src / alt / title)
    const imgs = document.querySelectorAll(".lowermid img");
    for (const img of imgs) {
      const info = (img.getAttribute("src") || "") + " " +
                   (img.getAttribute("alt") || "") + " " +
                   (img.getAttribute("title") || "");
      if (re.test(info)) return true;
    }

    // 3) text sa loob ng middle panel at sa mga picking label
    const mid = document.querySelector(".lowermid");
    if (mid && re.test(mid.textContent || "")) return true;
    const labels = document.querySelectorAll(".picking-label");
    for (const l of labels) {
      if (re.test(l.textContent || "")) return true;
    }
    return false;
  }

  // --- TURN ARROWS SA GILID NG TIMER (PINAKA-UPDATED) ---
  function syncTurnArrows() {
    const leftOn = document.querySelector('[id^="pick-left-"].active-pick, [id^="ban-left-"].active-ban');
    const rightOn = document.querySelector('[id^="pick-right-"].active-pick, [id^="ban-right-"].active-ban');
    
    // ADJUSTMENT / LAST CHANCE detection.
    // Hindi na gumagamit ng document.body.innerText kasi:
    //  - hindi kasama sa innerText yung nakatagong #phase (.phasebox = display:none)
    //  - hindi kasama yung <img> (yung ADJUSTMENT na nasa arrow image)
    const isBoth = isBothTurn();

    const L = document.getElementById("turn-arrow-left");
    const R = document.getElementById("turn-arrow-right");
    
    if (L && R) {
        const mode = isBoth ? "both" : (leftOn ? "L" : "") + (rightOn ? "R" : "");

        // Palitan lang kapag nagbago ang mode (para hindi nare-restart ang animation every 1s)
        if (mode !== syncTurnArrows.lastMode) {
            syncTurnArrows.lastMode = mode;

            L.classList.remove("both-on", "on");
            R.classList.remove("both-on", "on");

            if (isBoth) {
                // Kapag adjustment, sabay silang dalawa at nakatutok palabas
                L.classList.add("both-on");
                R.classList.add("both-on");
            } else {
                // Normal na pick/ban
                if (leftOn) L.classList.add("on");
                if (rightOn) R.classList.add("on");
            }

            // I-restart ang animation ng DALAWA nang sabay para pareho ang simula.
            // (Kung dati nang gumagalaw yung isa, hindi na sila magkasabay.)
            const spans = [L.querySelector("span"), R.querySelector("span")];
            spans.forEach((sp) => { if (sp) sp.style.animation = "none"; });
            void L.offsetWidth; // force reflow
            spans.forEach((sp) => { if (sp) sp.style.animation = ""; });
        }
    }
  }

  // I-run agad pagka-load
  syncTurnArrows();

  // Mag-check lang every 1 segundo (Ito ang safe para hindi mag-bug ang data)
  setInterval(syncTurnArrows, 1000);
  
  // Initial calls
  syncGrowingSlots();
  syncPickingLabels();

  // --- TIMER BAR (MPL STYLE: dalawang dulo, nagtatagpo sa gitna = 0) ---
  // Binabasa ang value ng original #timer-bar (kahit scaleX o width ang ginagamit
  // ng script mo) at ginagamit sa dalawang kalahati.
  (function timerBarMPL() {
    const src = document.getElementById("timer-bar");
    const fills = document.querySelectorAll(".tb-fill");
    if (!src || fills.length === 0) return;

    function tick() {
      let ratio = 1;
      try {
        const cs = getComputedStyle(src);
        let scale = 1;
        if (cs.transform && cs.transform !== "none") {
          const m = cs.transform.match(/matrix\(([^)]+)\)/);
          if (m) scale = parseFloat(m[1].split(",")[0]);
        }
        const parentW = src.parentElement.clientWidth || 1;
        const widthRatio = src.offsetWidth / parentW;
        ratio = scale * widthRatio;
      } catch (e) {}
      ratio = Math.max(0, Math.min(1, isFinite(ratio) ? ratio : 1));
      fills.forEach((f) => (f.style.transform = "scaleX(" + ratio + ")"));
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
