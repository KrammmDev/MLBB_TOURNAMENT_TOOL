<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Match Winner · MLBB</title>
    <link rel="stylesheet" href="/themes/match-winner.css" />
  </head>
  <body data-matchwinner-theme="arena">
    <main id="winnerStage" aria-label="Match winner overlay">
      <section
        id="winnerWrapper"
        class="winner-wrapper"
        aria-live="polite"
        aria-hidden="true"
      >
        <aside class="tournament-rail">
          <span>MLBB · MATCH RESULT</span>
          <div id="tournamentName">15TH LCUAA ESPORTS MLBB</div>
          <span>PROVE YOUR LEGACY</span>
        </aside>
        <div class="result-sheet">
          <header class="winner-rail">
            <div class="victory-heading">VICTORY</div>
            <span id="gameNumber">GAME 1</span>
          </header>
          <div class="result-meta">
            <span>MOBILE LEGENDS: BANG BANG</span
            ><span>OFFICIAL MATCH RESULT</span>
          </div>
          <div class="winner-body">
            <article class="team-card winning-team">
              <span class="result-tag">VICTORY</span>
              <div class="team-logo" id="winnerLogoSlot">
                <img id="winnerLogoImg" alt="Winning team logo" hidden />
              </div>
              <div id="winnerName" class="team-name"></div>
            </article>
            <div class="versus">
              <span>MATCH</span><strong>VS</strong><span>RESULT</span>
            </div>
            <article class="team-card losing-team">
              <span class="result-tag">DEFEAT</span>
              <div class="team-logo" id="loserLogoSlot">
                <img id="loserLogoImg" alt="Losing team logo" hidden />
              </div>
              <div id="loserName" class="team-name"></div>
            </article>
          </div>
          <footer class="result-footer">
            <strong id="resultMatch" hidden></strong
            ><span id="resultStageDay" hidden></span
            ><span id="resultPatch" hidden></span>
          </footer>
        </div>
      </section>
    </main>
    <script src="/script/match-state.js"></script>
    <script src="/script/match-client.js"></script>
    <script src="/script/roster-model.js"></script>
    <script src="/script/broadcast-color-model.js"></script>
    <script src="/script/broadcast-color-client.js"></script>
    <script src="/script/match-winner.js"></script>
  </body>
</html>
