<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Match Winner · MLBB</title>
    <link rel="stylesheet" href="/themes/match-winner.css" />
  </head>
  <body>
    <main id="winnerStage" aria-label="Match winner overlay">
      <section
        id="winnerWrapper"
        class="winner-wrapper"
        aria-live="polite"
        aria-hidden="true"
      >
        <img
          id="winnerWatermark"
          class="winner-watermark"
          alt=""
          aria-hidden="true"
          hidden
        />
        <header class="winner-rail">
          <span class="result-label">MATCH RESULT</span>
          <span id="gameNumber" class="game-number">GAME 1</span>
        </header>
        <div class="winner-body">
          <div class="team-logo" id="winnerLogoSlot">
            <img id="winnerLogoImg" alt="Winning team logo" hidden />
          </div>
          <div class="winner-copy">
            <p class="winner-kicker">VICTORY</p>
            <h1 class="winner-title">MATCH WINNER</h1>
            <div class="winner-divider" aria-hidden="true"></div>
            <div id="winnerName" class="team-name"></div>
          </div>
        </div>
        <div class="winner-bottom" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </section>
    </main>
    <script src="/script/match-state.js"></script>
    <script src="/script/match-client.js"></script>
    <script src="/script/roster-model.js"></script>
    <script src="/script/match-winner.js"></script>
  </body>
</html>
