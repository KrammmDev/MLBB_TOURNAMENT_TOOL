<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Build View</title>
  <link rel="stylesheet" href="builds.css">
</head>
<body>
  <main class="mainbox" aria-label="Live equipment builds">
    <div class="buildbox">
      <section class="side" id="blue-side" aria-label="Blue team builds">
      <div class="player" id="blueside1">
          <div class="itembox" id="item1"></div>
          <div class="itembox" id="item2"></div>
          <div class="itembox" id="item3"></div>
          <div class="itembox" id="item4"></div>
          <div class="itembox" id="item5"></div>
          <div class="itembox" id="item6"></div>
        <div class="hero"><div id="image-box-1" class="image-box"><img id="image-display-1" src="/Assets/HeroPick/idle.png" alt="Player 1 hero"></div></div>
      </div>
      <div class="player" id="blueside2">
          <div class="itembox" id="item1"></div>
          <div class="itembox" id="item2"></div>
          <div class="itembox" id="item3"></div>
          <div class="itembox" id="item4"></div>
          <div class="itembox" id="item5"></div>
          <div class="itembox" id="item6"></div>
        <div class="hero"><div id="image-box-2" class="image-box"><img id="image-display-2" src="/Assets/HeroPick/idle.png" alt="Player 2 hero"></div></div>
      </div>
      <div class="player" id="blueside3">
          <div class="itembox" id="item1"></div>
          <div class="itembox" id="item2"></div>
          <div class="itembox" id="item3"></div>
          <div class="itembox" id="item4"></div>
          <div class="itembox" id="item5"></div>
          <div class="itembox" id="item6"></div>
        <div class="hero"><div id="image-box-3" class="image-box"><img id="image-display-3" src="/Assets/HeroPick/idle.png" alt="Player 3 hero"></div></div>
      </div>
      <div class="player" id="blueside4">
          <div class="itembox" id="item1"></div>
          <div class="itembox" id="item2"></div>
          <div class="itembox" id="item3"></div>
          <div class="itembox" id="item4"></div>
          <div class="itembox" id="item5"></div>
          <div class="itembox" id="item6"></div>
        <div class="hero"><div id="image-box-4" class="image-box"><img id="image-display-4" src="/Assets/HeroPick/idle.png" alt="Player 4 hero"></div></div>
      </div>
      <div class="player" id="blueside5">
          <div class="itembox" id="item1"></div>
          <div class="itembox" id="item2"></div>
          <div class="itembox" id="item3"></div>
          <div class="itembox" id="item4"></div>
          <div class="itembox" id="item5"></div>
          <div class="itembox" id="item6"></div>
        <div class="hero"><div id="image-box-5" class="image-box"><img id="image-display-5" src="/Assets/HeroPick/idle.png" alt="Player 5 hero"></div></div>
      </div>
      </section>
      <div class="middle" id="middle" aria-label="Item Build">
        <span>ITEM</span>
        <span>BUILD</span>
      </div>
      <section class="side" id="red-side" aria-label="Red team builds">
      <div class="player" id="redside1">
        <div class="hero"><div id="image-box-6" class="image-box"><img id="image-display-6" src="/Assets/HeroPick/idle.png" alt="Player 6 hero"></div></div>
          <div class="itembox" id="item6"></div>
          <div class="itembox" id="item5"></div>
          <div class="itembox" id="item4"></div>
          <div class="itembox" id="item3"></div>
          <div class="itembox" id="item2"></div>
          <div class="itembox" id="item1"></div>
      </div>
      <div class="player" id="redside2">
        <div class="hero"><div id="image-box-7" class="image-box"><img id="image-display-7" src="/Assets/HeroPick/idle.png" alt="Player 7 hero"></div></div>
          <div class="itembox" id="item6"></div>
          <div class="itembox" id="item5"></div>
          <div class="itembox" id="item4"></div>
          <div class="itembox" id="item3"></div>
          <div class="itembox" id="item2"></div>
          <div class="itembox" id="item1"></div>
      </div>
      <div class="player" id="redside3">
        <div class="hero"><div id="image-box-8" class="image-box"><img id="image-display-8" src="/Assets/HeroPick/idle.png" alt="Player 8 hero"></div></div>
          <div class="itembox" id="item6"></div>
          <div class="itembox" id="item5"></div>
          <div class="itembox" id="item4"></div>
          <div class="itembox" id="item3"></div>
          <div class="itembox" id="item2"></div>
          <div class="itembox" id="item1"></div>
      </div>
      <div class="player" id="redside4">
        <div class="hero"><div id="image-box-9" class="image-box"><img id="image-display-9" src="/Assets/HeroPick/idle.png" alt="Player 9 hero"></div></div>
          <div class="itembox" id="item6"></div>
          <div class="itembox" id="item5"></div>
          <div class="itembox" id="item4"></div>
          <div class="itembox" id="item3"></div>
          <div class="itembox" id="item2"></div>
          <div class="itembox" id="item1"></div>
      </div>
      <div class="player" id="redside5">
        <div class="hero"><div id="image-box-10" class="image-box"><img id="image-display-10" src="/Assets/HeroPick/idle.png" alt="Player 10 hero"></div></div>
          <div class="itembox" id="item6"></div>
          <div class="itembox" id="item5"></div>
          <div class="itembox" id="item4"></div>
          <div class="itembox" id="item3"></div>
          <div class="itembox" id="item2"></div>
          <div class="itembox" id="item1"></div>
      </div>
      </section>
    </div>
  </main>
  <audio id="hero-voice" muted></audio>
  <script src="script/build.js"></script>
  <script src="script/build-recognition-bridge.js"></script>
</body>
</html>
