<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>Control Panel · 6 Bans + BO1</title>
    <link rel="stylesheet" href="control.css" />
    <style>
      /* ===== NOTIF CONTROL STYLES ===== */
      @font-face {
        font-family: "Big Noodle Titling";
        src: url("Assets/Font/big_noodle_titling.ttf") format("truetype");
      }

      .notif-section {
        margin-top: 30px;
        width: 100%;
      }

      .notif-main-container {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .notif-panel {
        background-color: rgba(26, 28, 32, 0.25);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(63, 63, 70, 0.6);
        overflow: hidden;
      }

      .notif-status-bar {
        background-color: rgba(0, 0, 0, 0.3);
        text-align: center;
        padding: 10px 0;
        border-bottom: 1px solid rgba(63, 63, 70, 0.6);
      }

      #notif-status {
        font-family: "Big Noodle Titling", sans-serif;
        font-size: 2em;
        color: #eaeaea;
        font-style: oblique;
      }

      .notif-controls-body {
        display: flex;
        padding: 15px;
        gap: 15px;
      }

      .notif-separator {
        width: 20px;
        background-color: rgba(234, 234, 234, 0.15);
      }

      .notif-objective-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .notif-sub-buttons {
        display: flex;
        gap: 8px;
      }

      .notif-sub-buttons button {
        flex: 1;
        height: 120px;
      }

      .notif-panel button {
        font-family: "Big Noodle Titling", sans-serif;
        font-size: 1.1em;
        padding: 12px 8px;
        border: 2px solid #3f3f46;
        background-color: rgba(255, 255, 255, 0.1);
        color: #eaeaea;
        border-radius: 0;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        width: 100%;
      }

      .notif-panel button:hover {
        transform: scale(1.02);
        box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        border-color: #a855f7;
        background-color: rgba(168, 85, 247, 0.2);
      }

      .notif-blue-btn {
        border-color: #00afff !important;
      }
      .notif-blue-btn:hover {
        background-color: rgba(0, 175, 255, 0.2) !important;
        box-shadow: 0 0 15px rgba(0, 175, 255, 0.5) !important;
      }

      .notif-red-btn {
        border-color: #f94868 !important;
      }
      .notif-red-btn:hover {
        background-color: rgba(249, 72, 104, 0.2) !important;
        box-shadow: 0 0 15px rgba(249, 72, 104, 0.5) !important;
      }

      .notif-objective-panel {
        flex: 0 0 360px;
      }

      .notif-kill-panel {
        flex: 1;
        min-width: 300px;
      }

      .notif-kill-header {
        font-family: "Big Noodle Titling", sans-serif;
        background-color: rgba(0, 0, 0, 0.4);
        font-size: 3em;
        text-align: center;
        padding: 5px 0;
        font-style: oblique;
        border-bottom: 1px solid rgba(63, 63, 70, 0.6);
        color: #eaeaea;
      }

      .notif-kill-buttons {
        display: flex;
        justify-content: center;
        gap: 10px;
        padding: 15px;
        flex-wrap: wrap;
      }

      .notif-kill-buttons button {
        font-family: "Big Noodle Titling", sans-serif;
        flex: 1 1 calc(33% - 10px);
        min-width: 100px;
        height: 80px;
        background-color: rgba(234, 234, 234, 0.85);
        color: #111;
        border: 3px solid rgba(255, 255, 255, 0.5);
        font-size: 1.2em;
        cursor: pointer;
        transition: all 0.2s;
      }

      .notif-kill-buttons button:hover {
        border-color: #00ff8c;
        box-shadow: 0 0 20px #00ff8c;
        background-color: #fff;
      }

      @media (max-width: 900px) {
        .notif-main-container {
          flex-direction: column;
        }
        .notif-objective-panel {
          flex: unset;
          width: 100%;
        }
        .notif-controls-body {
          flex-direction: column;
        }
        .notif-separator {
          display: none;
        }
        .notif-sub-buttons button {
          height: 80px;
        }
      }

      /* FIXED: Better input styles */
      .match-input-group input {
        padding: 8px 12px;
        font-size: 16px;
        border: 1px solid #3f3f46;
        background-color: white;
        color: black;
        border-radius: 4px;
      }

      .match-input-group label {
        font-weight: bold;
        color: #eaeaea;
      }

      .match-input-group button {
        padding: 8px 16px;
        background-color: #00afff;
        border: none;
        color: white;
        cursor: pointer;
        border-radius: 4px;
      }

      .match-input-group button:hover {
        background-color: #0088cc;
      }

      /* FIXED: Game # input specific styles */
      #game-number {
        background-color: white !important;
        color: black !important;
        padding: 8px !important;
        border-radius: 4px !important;
        border: 1px solid #3f3f46 !important;
      }

      #game-number:focus {
        outline: none !important;
        border-color: #00afff !important;
        box-shadow: 0 0 5px rgba(0, 175, 255, 0.5) !important;
      }

      /* Active format highlight */
      .format-control button.active-format {
        border-color: #ffcc00;
        background-color: rgba(255, 204, 0, 0.25);
        box-shadow: 0 0 12px rgba(255, 204, 0, 0.5);
        transform: scale(1.02);
      }

      /* Auto-save status indicators (copied from original) */
      .team-name-row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 8px;
      }

      .team-name-row input {
        flex: 1;
        padding: 8px 12px;
        font-size: 16px;
        border: 1px solid #3f3f46;
        background-color: white;
        color: black;
        border-radius: 4px;
        transition: all 0.3s;
      }

      .team-name-row input:focus {
        outline: none;
        border-color: #00afff;
        box-shadow: 0 0 10px rgba(0, 175, 255, 0.3);
      }

      .team-name-row input.saving {
        border-color: #ffcc00;
        background-color: #fff8e1;
      }

      .team-name-row input.saved {
        border-color: #00ff8c;
        background-color: #e8f5e9;
      }

      .status-indicator {
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 4px;
        font-weight: bold;
        min-width: 60px;
        text-align: center;
      }

      .status-indicator.idle {
        color: #888;
      }
      .status-indicator.saving {
        color: #ffcc00;
        animation: pulse 1s infinite;
      }
      .status-indicator.saved {
        color: #00ff8c;
      }
      .status-indicator.error {
        color: #ff4444;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
    </style>

      .control-sync-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 16px;

    </style>
  </head>

    <script>
      var blueScore = 0;
      var redScore = 0;

      // ========== BO1 INTEGRATION (UPDATED setFormat) ==========

      function highlightActiveFormat(activeFormat) {
        const formatBtns = document.querySelectorAll(".format-control button");
        formatBtns.forEach((btn) => {
          const btnFormat = parseInt(btn.innerText.replace("BO", ""));
          if (btnFormat === activeFormat) btn.classList.add("active-format");
          else btn.classList.remove("active-format");
        });
      }

      function createDots(containerId, total) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = "";
        for (let i = 0; i < total; i++) {
          const dot = document.createElement("span");
          dot.classList.add("dot");
          container.appendChild(dot);
        }
      }

      function getWinsNeeded(format) {
        if (format === 1) return 1; // BO1 = 1 win
        if (format === 3) return 2;
        if (format === 5) return 3;
        if (format === 7) return 4;
        return 2;
      }

      function updateScoreDots() {
        const format = parseInt(localStorage.getItem("matchFormat")) || 3;
        const winsNeeded = getWinsNeeded(format);
        createDots("blue-score-display", winsNeeded);
        createDots("red-score-display", winsNeeded);
        document
          .querySelectorAll("#blue-score-display .dot")
          .forEach((dot, i) => {
            dot.classList.toggle("active", i < blueScore);
          });
        document
          .querySelectorAll("#red-score-display .dot")
          .forEach((dot, i) => {
            dot.classList.toggle("active", i < redScore);
          });
      }

      async function setVideo(playerId) {
        updateNotifStatus(`SENDING ${playerId.replace("videoPlayer", "")}...`);
        try {
          const response = await fetch("/api/notification", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ videoId: playerId }),
          });
          if (response.ok) {
            updateNotifStatus(
              `PLAYING M${playerId.replace("videoPlayer", "")}`,
            );
            setTimeout(() => updateNotifStatus("Standby"), 3000);
          } else {
            updateNotifStatus("ERROR SENDING");
          }
        } catch (error) {
          console.error("Connection Error:", error);
          updateNotifStatus("SERVER ERROR");
        }
      }

      function updateNotifStatus(message) {
        const statusEl = document.getElementById("notif-status");
        if (statusEl) statusEl.textContent = message;
      }

      document.addEventListener("keydown", (event) => {
        const keys = {
          w: "videoPlayer1",
          a: "videoPlayer2",
          s: "videoPlayer3",
          r: "videoPlayer4",
          d: "videoPlayer5",
          f: "videoPlayer6",
          1: "videoPlayer7",
          2: "videoPlayer8",
          3: "videoPlayer9",
          4: "videoPlayer10",
          5: "videoPlayer11",
          6: "videoPlayer12",
        };
        if (
          keys[event.key] &&
          event.target.tagName !== "INPUT" &&
          event.target.tagName !== "TEXTAREA" &&
          event.target.tagName !== "SELECT" && !event.target.isContentEditable
        ) {
          event.preventDefault();
          setVideo(keys[event.key]);
        }
      });

      window.addEventListener("load", async () => {
        try {
          await ControlMatch.ready;
        } catch (error) { console.error("Control panel unavailable:", error.message); }
      });
    </script>
